# ARMAGEDON - configuração do gerador de vídeo em GPU alugada
# Escolha um preset em `preset:` conforme a VRAM da GPU que você alugou.
# Detalhes de cada modelo/VRAM em models.md

preset: ltx            # ltx | cogvideox | wan | hunyuan

# Alvo do vídeo final (clipes curtos são gerados e emendados até somar isto)
target_seconds: 60
per_clip_seconds: 5     # duração de cada clipe gerado (o modelo aguenta ~5s bem)
fps_final: 24           # fps do mp4 final (interpolação preenche se o modelo gerar menos)

# Continuidade entre clipes: cada clipe novo parte do ÚLTIMO frame do anterior
chain_mode: last_frame  # last_frame | independent

# Pós-processamento (tudo opcional; ffmpeg já basta pra emendar)
interpolate: true       # sobe pro fps_final usando ffmpeg minterpolate (ou RIFE se instalado)
upscale: false          # Real-ESRGAN 2x (precisa `pip install realesrgan`) — deixa false na 1a vez
audio: none             # none | file:trilha.mp3   (som é adicionado no final via ffmpeg)

seed: -1                # -1 = aleatório

# ---- presets (não precisa mexer; ajuste fino aqui se quiser) --------------
presets:
  ltx:                  # ~12-24 GB VRAM. Rápido e barato. Bom pra iterar. (RTX 4090)
    repo: "Lightricks/LTX-Video"
    kind: ltx
    width: 768
    height: 512
    model_fps: 24
    steps: 30
    guidance: 3.0
    dtype: bfloat16
    offload: false

  cogvideox:            # ~16-24 GB. Qualidade média-alta. (RTX 4090 / L4)
    repo: "THUDM/CogVideoX-5b-I2V"
    kind: cogvideox
    width: 720
    height: 480
    model_fps: 8
    steps: 50
    guidance: 6.0
    dtype: bfloat16
    offload: true

  wan:                  # ~40-48 GB. Qualidade alta. (A100 40/80, L40S)
    repo: "Wan-AI/Wan2.1-I2V-14B-720P-Diffusers"
    kind: wan
    width: 1280
    height: 720
    model_fps: 16
    steps: 40
    guidance: 5.0
    dtype: bfloat16
    offload: true

  hunyuan:             # ~48-80 GB. Topo aberto. (A100 80, H100)
    repo: "hunyuanvideo-community/HunyuanVideo-I2V"
    kind: hunyuan
    width: 1280
    height: 720
    model_fps: 24
    steps: 50
    guidance: 6.0
    dtype: bfloat16
    offload: true
